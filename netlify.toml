[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── security headers on every response ──
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "no-referrer"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# pages that render PHI must never be cached by a shared proxy
[[headers]]
  for = "/Patient/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

[[headers]]
  for = "/Provider/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

[[headers]]
  for = "/Admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

# ── API ──
[[redirects]]
  from = "/api/auth"
  to   = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/users"
  to   = "/.netlify/functions/admin-users"
  status = 200
  force = true

[[redirects]]
  from = "/api/claim-status"
  to   = "/.netlify/functions/claim-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/claims-queue"
  to   = "/.netlify/functions/claims-queue"
  status = 200
  force = true

[[redirects]]
  from = "/api/claims-cron"
  to   = "/.netlify/functions/claims-cron"
  status = 200
  force = true

[[redirects]]
  from = "/api/era"
  to   = "/.netlify/functions/era"
  status = 200
  force = true

[[redirects]]
  from = "/api/data"
  to   = "/.netlify/functions/data"
  status = 200
  force = true

[[redirects]]
  from = "/api/claims"
  to   = "/.netlify/functions/claims"
  status = 200
  force = true

# Fallback: if the file was copied in under its delivered name rather than
# renamed to claims.js, this keeps /api/claims working.
[[redirects]]
  from = "/api/claims-alt"
  to   = "/.netlify/functions/functions-claims"
  status = 200
  force = true

[[redirects]]
  from = "/api/eligibility"
  to   = "/.netlify/functions/eligibility"
  status = 200
  force = true

[[redirects]]
  from = "/api/import"
  to   = "/.netlify/functions/import"
  status = 200
  force = true

[[redirects]]
  from = "/api/bootstrap"
  to   = "/.netlify/functions/bootstrap"
  status = 200
  force = true


# Wakes every hour and submits only when the practice's local hour matches
# CLAIMS_CRON_HOUR. Hourly rather than once a day so daylight saving never
# shifts the run time.
[functions."claims-cron"]
  schedule = "0 * * * *"
