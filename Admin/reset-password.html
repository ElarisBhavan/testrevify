<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — ReviFlow</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/logo-180.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8F3;--paper-2:#F2EFE7;--ink:#0D1A16;--muted:#5D6B67;--dim:#93A19D;
  --line:rgba(13,26,22,.08);--line-2:rgba(13,26,22,.14);
  --green:#0E9D73;--green-d:#0A5C46;--green-s:#E2F4EC;
  --blue:#3B6FF5;--blue-s:#E8EFFE;--amber:#C98A18;--amber-s:#FCF3DA;
  --coral:#D0603F;--coral-s:#FBEAE4;--violet:#8B5CF6;--violet-s:#F1EBFE;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --e:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:9px}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aur{position:absolute;border-radius:50%;filter:blur(94px);mix-blend-mode:multiply;opacity:.46}
.a1{width:58vw;height:58vw;min-width:500px;min-height:500px;top:-30%;left:-14%;background:radial-gradient(circle,rgba(14,157,115,.4),transparent 66%);animation:f1 30s ease-in-out infinite}
.a2{width:46vw;height:46vw;min-width:400px;min-height:400px;top:-20%;right:-10%;background:radial-gradient(circle,rgba(139,92,246,.32),transparent 66%);animation:f2 36s ease-in-out infinite}
.a3{width:38vw;height:38vw;min-width:350px;min-height:350px;bottom:-28%;left:28%;background:radial-gradient(circle,rgba(59,111,245,.24),transparent 66%);animation:f3 42s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,6vh) scale(1.1)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7vw,5vh) scale(1.12)}}
@keyframes f3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7vw,-6vh) scale(1.08)}}
.mesh{position:absolute;inset:-2px;background-image:linear-gradient(rgba(13,26,22,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(13,26,22,.04) 1px,transparent 1px);background-size:46px 46px;animation:meshD 36s linear infinite;-webkit-mask-image:radial-gradient(120% 80% at 50% 20%,#000,transparent 76%);mask-image:radial-gradient(120% 80% at 50% 20%,#000,transparent 76%)}
@keyframes meshD{to{background-position:46px 46px}}

.hdr{position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:clamp(14px,2vw,22px) clamp(16px,3.2vw,42px);border-bottom:1px solid var(--line);background:rgba(250,248,243,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--violet),var(--blue));display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(139,92,246,.85)}
.brand .mk svg{width:17px;height:17px}
.brand span{font-family:'Sora',sans-serif;font-size:15.5px;font-weight:600;letter-spacing:-.035em}
.brand em{font-style:normal;color:var(--green);font-weight:400;font-size:.9em;margin-left:4px}
.hbtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:99px;border:1px solid var(--line-2);background:rgba(255,255,255,.66);font-size:13px;font-weight:600;transition:all .34s var(--e)}
.hbtn svg{width:15px;height:15px;stroke:var(--green);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .34s var(--e)}
.hbtn:hover{border-color:var(--green);background:#fff;transform:translateX(-2px)}
.hbtn:hover svg{transform:translateX(-3px)}

.wrap{position:relative;z-index:2;flex:1;display:grid;place-items:center;padding:clamp(22px,4vw,54px) clamp(16px,3.2vw,42px)}
.card{width:min(430px,100%);background:#fff;border:1px solid var(--line-2);border-radius:22px;
  padding:clamp(26px,3.2vw,36px);box-shadow:0 30px 70px -46px rgba(11,61,49,.55);
  opacity:0;transform:translateY(24px);animation:rise .85s var(--e) .1s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.crest{width:56px;height:56px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(140deg,var(--violet),var(--blue));display:grid;place-items:center;box-shadow:0 16px 32px -18px rgba(139,92,246,.9)}
.crest svg{width:29px;height:29px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.crest .tick{stroke-dasharray:22;stroke-dashoffset:22;animation:draw 1.1s var(--e) .7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:99px;background:var(--violet-s);color:var(--violet);font-family:var(--mono);font-size:9.6px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:13px}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--violet);animation:blip 2.2s infinite}
@keyframes blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.75)}}
.card h1{font-family:'Sora',sans-serif;font-size:clamp(22px,2.6vw,27px);line-height:1.1;font-weight:600;letter-spacing:-.04em;margin-bottom:8px}
.card .sub{font-size:13.2px;line-height:1.6;color:var(--muted);margin-bottom:22px}
.step{display:none}.step.on{display:block;animation:fade .42s var(--e)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.fld{display:block;margin-bottom:15px}
.fld>span{display:flex;align-items:center;font-size:11.8px;font-weight:600;color:var(--muted);margin-bottom:7px}
.fld>span a{margin-left:auto;font-size:11.4px;color:var(--blue);font-weight:600}
.fld>span a:hover{text-decoration:underline}
.ctrl{position:relative;display:flex;align-items:center}
.ctrl input{width:100%;height:46px;padding:0 14px;background:var(--paper);border:1px solid var(--line-2);border-radius:11px;font-size:14px;transition:all .28s var(--e)}
.ctrl input:hover{border-color:#B7C0BD}
.ctrl input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(14,157,115,.13)}
.ctrl input.bad{border-color:var(--coral);box-shadow:0 0 0 3px rgba(208,96,63,.12)}
.ctrl.pw input{padding-right:44px}
.peek{position:absolute;right:6px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;transition:background .3s var(--e)}
.peek svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.peek:hover{background:var(--paper-2)}
.err{display:none;font-size:11.6px;color:var(--coral);margin-top:6px;line-height:1.5}
.err.show{display:block}
.ok{display:none;font-size:11.8px;color:var(--green-d);margin-top:6px;line-height:1.55;padding:11px 13px;border-radius:10px;background:var(--green-s)}
.ok.show{display:block}
.row{display:flex;align-items:center;gap:9px;margin-bottom:20px;font-size:12.6px;color:var(--muted)}
.cbx{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.cbx input{position:absolute;opacity:0}
.cbx .bx{width:17px;height:17px;border-radius:5px;border:1.6px solid var(--line-2);display:grid;place-items:center;transition:all .28s var(--e)}
.cbx .bx svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:all .28s var(--e)}
.cbx input:checked+.bx{background:var(--green);border-color:var(--green)}
.cbx input:checked+.bx svg{opacity:1;transform:none}
.go{position:relative;overflow:hidden;width:100%;height:48px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border-radius:12px;background:linear-gradient(120deg,var(--green-d),var(--green));color:#F3FBF8;font-size:14.5px;font-weight:600;
  box-shadow:0 14px 30px -16px rgba(10,92,70,.95);transition:all .34s var(--e)}
.go::after{content:'';position:absolute;top:0;left:-120%;width:52%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);transition:left .8s var(--e)}
.go:hover{transform:translateY(-2px)}.go:hover::after{left:150%}
.go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .34s var(--e)}
.go:hover svg{transform:translateX(3px)}
.go .spin{width:16px;height:16px;border:2px solid rgba(243,251,248,.35);border-top-color:#F3FBF8;border-radius:50%;animation:sp .7s linear infinite;display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.go.busy .lbl,.go.busy svg:not(.spin){display:none}
.go.busy .spin{display:block}
.ghost{width:100%;height:44px;margin-top:9px;border-radius:12px;border:1px solid var(--line-2);background:var(--paper);font-size:13.4px;font-weight:600;transition:all .3s var(--e)}
.ghost:hover{border-color:var(--ink);background:#fff}
.foot{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:12.2px;color:var(--muted);text-align:center;line-height:1.6}
.foot a{color:var(--blue);font-weight:600}
.foot a:hover{text-decoration:underline}
.notice{margin-top:16px;padding:13px 15px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line);display:flex;gap:11px;font-size:11.6px;line-height:1.6;color:var(--muted)}
.notice svg{width:15px;height:15px;stroke:var(--violet);fill:none;stroke-width:2;flex:none;margin-top:1px}
.notice b{color:var(--ink)}

/* MFA code boxes */
.codes{display:flex;gap:8px;justify-content:space-between;margin-bottom:16px}
.codes input{width:100%;height:56px;text-align:center;font-family:var(--mono);font-size:22px;font-weight:600;
  border:1px solid var(--line-2);border-radius:12px;background:var(--paper);transition:all .26s var(--e)}
.codes input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(14,157,115,.14);transform:translateY(-2px)}
.codes input.filled{border-color:var(--green);background:var(--green-s)}
.qrbox{text-align:center;padding:18px;border-radius:14px;background:var(--paper);border:1px solid var(--line-2);margin-bottom:16px}
.qrbox #qr{display:inline-block;padding:10px;background:#fff;border-radius:10px;line-height:0}
.qrbox .secret{margin-top:13px;font-family:var(--mono);font-size:12.4px;font-weight:600;letter-spacing:.08em;word-break:break-all;padding:9px 12px;border-radius:9px;background:#fff;border:1px solid var(--line)}
.qrbox p{font-size:11.6px;color:var(--muted);margin-top:10px;line-height:1.55}
.mfaman{margin-top:11px;font-size:11.8px;color:var(--blue);font-weight:600;cursor:pointer}
.mfaman:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.card{opacity:1;transform:none}}


/* --rf-logo-styled */
img.mk{width:30px;height:30px;flex:none;border-radius:9px;object-fit:contain;
  background:transparent;box-shadow:none;padding:0;display:block}
img.brandmark{width:26px;height:26px;flex:none;object-fit:contain;display:block}
.crest img{width:100%;height:100%;object-fit:contain;display:block}
.crest{background:none!important;box-shadow:none!important;padding:4px}
.inv-h .lg img,.lg img{width:100%;height:100%;object-fit:contain;display:block}
.inv-h .lg,.lg{background:transparent!important;padding:2px}

/* rf-logomark-styled */
img.logo-mark{width:34px;height:34px;object-fit:contain;display:block;
  background:transparent!important;border:none!important;box-shadow:none!important}
</style>
<script src="../_guard.js"></script>
<script src="../_store.js"></script>
<script src="../_session.js"></script>
<link rel="stylesheet" href="../_session.css">
</head>
<body>

<div class="bg" aria-hidden="true"><div class="mesh"></div><div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div></div>

<header class="hdr">
  <div class="brand">
    <img class="mk" src="../assets/logo-64.png" alt="ReviFlow RCM">
    <span>R&nbsp;e&nbsp;v&nbsp;i&nbsp;F&nbsp;l&nbsp;o&nbsp;w</span>
  </div>
  <a href="admin-login.html" class="hbtn"><svg viewBox="0 0 24 24"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>Back to sign in</a>
</header>

<main class="wrap">
  <div class="card">
    <div class="crest"><img src="../assets/logo.png" alt="ReviFlow RCM"></div>
    <span class="eyebrow"><i></i>Account recovery</span>
    <h1>Choose a new password</h1>
    <p class="sub">Use at least 10 characters. A passphrase of three or four unrelated words works well.</p>

    <label class="fld">
      <span>New password</span>
      <div class="ctrl pw">
        <input type="password" id="p1" autocomplete="new-password" placeholder="••••••••••">
        <button type="button" class="peek" id="peek" aria-label="Show password">
          <svg viewBox="0 0 24 24" id="peekIcon"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </label>
    <label class="fld">
      <span>Confirm password</span>
      <div class="ctrl"><input type="password" id="p2" autocomplete="new-password" placeholder="••••••••••"></div>
      <p class="err" id="e1"></p>
    </label>
    <p class="ok" id="ok1"></p>
    <button class="go" id="save"><span class="lbl">Update password</span>
      <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg><span class="spin"></span></button>
    <p class="foot">Remembered it? <a href="admin-login.html">Sign in instead</a></p>
  </div>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var token=new URLSearchParams(location.search).get('token');
  if(!token){
    $('e1').textContent='This link is missing its token. Request a new reset email.';
    $('e1').classList.add('show');
    $('save').disabled=true;
  }
  var p1=$('p1');
  $('peek').addEventListener('click',function(){
    var show=p1.type==='password';p1.type=show?'text':'password';
    $('peekIcon').innerHTML=show
      ?'<path d="M2 12s3.6-7 10-7c2 0 3.8.7 5.3 1.7M22 12s-3.6 7-10 7c-2 0-3.8-.7-5.3-1.7"/><path d="M3 3l18 18"/>'
      :'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
  });
  $('save').addEventListener('click',async function(){
    var e=$('e1');e.classList.remove('show');
    if(p1.value.length<10){e.textContent='Use at least 10 characters.';e.classList.add('show');return;}
    if(p1.value!==$('p2').value){e.textContent='Those passwords do not match.';e.classList.add('show');return;}
    this.classList.add('busy');this.disabled=true;
    var r=await fetch('/api/auth?action=reset',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token,password:p1.value})});
    var j={};try{j=await r.json();}catch(x){}
    this.classList.remove('busy');this.disabled=false;
    if(r.ok){
      $('ok1').textContent=j.message||'Password updated.';
      $('ok1').classList.add('show');
      setTimeout(function(){location.href='admin-login.html';},2200);
    }else{
      e.textContent=j.message||'That reset link is no longer valid.';e.classList.add('show');
    }
  });
})();
</script>
</body>
</html>
